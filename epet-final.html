<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nomi – E-Pet</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #fdf6ee;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    #pet {
      font-size: 80px;
      margin: 10px 0 4px;
      transition: transform 0.2s;
      cursor: pointer;
    }

    #speech {
      font-size: 0.95rem;
      color: #888;
      min-height: 22px;
      margin-bottom: 16px;
      font-style: italic;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 7px 20px;
      border: 2px solid #f4845f;
      border-radius: 99px;
      background: white;
      color: #f4845f;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active { background: #f4845f; color: white; }

    .section { display: none; }
    .section.active { display: block; }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    input[type="date"] {
      padding: 7px;
      font-size: 0.9rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #555;
    }

    button {
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f4845f;
      color: white;
      font-weight: bold;
    }

    button:hover { opacity: 0.85; }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      text-align: left;
      cursor: pointer;
    }

    li.done { opacity: 0.5; }
    li.done .task-name { text-decoration: line-through; }

    .task-name { flex: 1; font-size: 0.95rem; }
    .task-date { font-size: 0.78rem; color: #f4845f; font-weight: bold; }
    .overdue   { color: #e53; }

    /* Report */
    #report {
      margin-top: 16px;
      background: white;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      font-size: 0.9rem;
      color: #555;
    }

    #report h3 { margin: 0 0 10px; color: #333; font-size: 1rem; }
    #report ul { margin-top: 8px; padding-left: 16px; list-style: disc; }
    #report li { background: none; border: none; padding: 2px 0; margin: 0; font-size: 0.9rem; }

    /* Calendar */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cal-header button { padding: 6px 12px; font-size: 0.85rem; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-name {
      font-size: 0.72rem;
      color: #aaa;
      font-weight: bold;
      padding: 4px 0;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      background: white;
      border: 1px solid #eee;
      position: relative;
    }

    .cal-day.today  { border: 2px solid #f4845f; font-weight: bold; color: #f4845f; }
    .cal-day.empty  { background: transparent; border: none; }
    .cal-day.has-task::after {
      content: '●';
      font-size: 0.45rem;
      color: #f4845f;
      position: absolute;
      bottom: 3px;
    }
  </style>
</head>
<body>

  <h2>🐾 Nomi</h2>
   <img id="pet" src="https://images.template.net/463647/Kawaii-Cat-Clipart-edit-online.png" alt="Nomi the pet" width="100">
  <div id="speech">Hi! Add a task for me to cheer on! 🎉</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('tasks', this)">📋 Tasks</button>
    <button class="tab"        onclick="showTab('calendar', this)">📅 Calendar</button>
    <button class="tab"        onclick="showTab('report-tab', this)">📊 Report</button>
  </div>

  <!-- Tasks -->
  <div id="tasks" class="section active">
    <div class="add-row">
      <input id="task-input" type="text" placeholder="Task name…">
      <input id="task-date"  type="date">
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="task-list"></ul>
  </div>

  <!-- Calendar -->
  <div id="calendar" class="section">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">◀</button>
      <strong id="cal-title"></strong>
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- Report -->
  <div id="report-tab" class="section">
    <button onclick="generateReport()">Generate Daily Report</button>
    <div id="report"></div>
  </div>

<script>
  // ── State ──────────────────────────────────────
  let tasks   = [];
  let calDate = new Date();

  const MESSAGES = {
    add:  ["I'll cheer you on! 💪", "Let's do this! 🔥", "New quest accepted! ⭐"],
    done: ["You did it!! 🎊", "I'm so proud! 🥹", "Amazing!! ✨"],
    pet:  ["Hehe~ 😸", "Stoooop~ 🙈", "*purrs* 💕"],
  };

  // ── Pet helpers ────────────────────────────────
  function say(type) {
    const list = MESSAGES[type];
    document.getElementById("speech").textContent =
      list[Math.floor(Math.random() * list.length)];
  }

  function bounce() {
    const pet = document.getElementById("pet");
    pet.style.transform = "scale(1.4)";
    setTimeout(() => pet.style.transform = "scale(1)", 200);
  }

  document.getElementById("pet").onclick = () => { bounce(); say("pet"); };

  // ── Tabs ───────────────────────────────────────
  function showTab(id, btn) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    btn.classList.add("active");
    if (id === "calendar") renderCalendar();
  }

  // ── Tasks ──────────────────────────────────────
  function addTask() {
    const name = document.getElementById("task-input").value.trim();
    const date = document.getElementById("task-date").value;
    if (!name) return;

    // Duplicate check (case-insensitive)
    if (tasks.some(t => t.name.toLowerCase() === name.toLowerCase())) {
      alert("This task already exists!");
      return;
    }

    tasks.push({ name, date, done: false });
    document.getElementById("task-input").value = "";
    document.getElementById("task-date").value  = "";

    bounce();
    say("add");
    renderTasks();
  }

  function renderTasks() {
    const ul = document.getElementById("task-list");
    ul.innerHTML = "";
    const today = new Date().toISOString().slice(0, 10);

    tasks.forEach((task) => {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");

      const isOverdue = task.date && task.date < today && !task.done;

      li.innerHTML = `
        <span class="task-name">${task.name}</span>
        ${task.date ? `<span class="task-date ${isOverdue ? "overdue" : ""}">${formatDate(task.date)}</span>` : ""}
      `;

      li.onclick = () => {
        task.done = !task.done;
        if (task.done) { bounce(); say("done"); }
        renderTasks();
        renderCalendar();
      };

      ul.appendChild(li);
    });
  }

  // ── Report ─────────────────────────────────────
  function generateReport() {
    const done = tasks.filter(t => t.done);
    const reportDiv = document.getElementById("report");

    const dateString = new Date().toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });

    if (done.length === 0) {
      reportDiv.innerHTML = `<h3>Report for ${dateString}</h3><p>No tasks completed yet.</p>`;
    } else {
      let html = `<h3>Report for ${dateString}</h3><ul>`;
      done.forEach(t => { html += `<li>${t.name}</li>`; });
      html += "</ul>";
      reportDiv.innerHTML = html;
    }
  }

  // ── Calendar ───────────────────────────────────
  function renderCalendar() {
    const year  = calDate.getFullYear();
    const month = calDate.getMonth();

    document.getElementById("cal-title").textContent =
      calDate.toLocaleString("default", { month: "long", year: "numeric" });

    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";

    ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(d => {
      const el = document.createElement("div");
      el.className = "cal-day-name";
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay    = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr    = new Date().toISOString().slice(0, 10);

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement("div");
      el.className = "cal-day empty";
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = d;

      if (dateStr === todayStr) el.classList.add("today");
      if (tasks.some(t => t.date === dateStr && !t.done)) el.classList.add("has-task");

      grid.appendChild(el);
    }
  }

  function changeMonth(dir) {
    calDate.setMonth(calDate.getMonth() + dir);
    renderCalendar();
  }

  // ── Helpers ────────────────────────────────────
  function formatDate(str) {
    const [y, m, d] = str.split("-");
    return `${m}/${d}`;
  }

  document.getElementById("task-date").value = new Date().toISOString().slice(0, 10);
  renderCalendar();
</script>

</body>
</html>
