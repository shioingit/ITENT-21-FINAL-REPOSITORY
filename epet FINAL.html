<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nomi – E-Pet</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day { border: 1px solid #ccc; padding: 8px; cursor: pointer; }
    .cal-day.today { background: #f4845f; color: white; font-weight: bold; }
    .cal-day.empty { background: transparent; border: none; }
  </style>
</head>
<body>

  <h2>🐾 Nomi</h2>

  <!-- Task input -->
  <input id="task-input" type="text" placeholder="Task name…">
  <input id="task-date" type="date">
  <button onclick="addTask()">Add</button>

  <!-- Task list -->
  <ul id="task-list"></ul>

  <!-- Calendar -->
  <div id="calendar">
    <h3 id="cal-title"></h3>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- Report -->
  <div id="report"></div>

<script>
  let tasks = [];
  let calDate = new Date();

  // Add task with duplicate check
  function addTask() {
    const name = document.getElementById("task-input").value.trim();
    const date = document.getElementById("task-date").value;
    if (!name) return;

    if (tasks.some(t => t.name.toLowerCase() === name.toLowerCase())) {
      alert("This task already exists!");
      return;
    }

    tasks.push({ name, date, done: false });
    document.getElementById("task-input").value = "";
    document.getElementById("task-date").value = "";

    renderTasks();
    renderCalendar();
  }

  // Render tasks list
  function renderTasks() {
    const ul = document.getElementById("task-list");
    ul.innerHTML = "";
    tasks.forEach((task, i) => {
      const li = document.createElement("li");
      li.textContent = task.name + (task.date ? " (" + task.date + ")" : "");
      if (task.done) li.style.textDecoration = "line-through";
      li.onclick = () => {
        tasks[i].done = !tasks[i].done;
        renderTasks();
      };
      ul.appendChild(li);
    });
  }

  // Render calendar with clickable days
  function renderCalendar() {
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();
    const todayStr = new Date().toISOString().slice(0, 10);

    document.getElementById("cal-title").textContent =
      calDate.toLocaleString("default", { month: "long", year: "numeric" });

    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement("div");
      el.className = "cal-day empty";
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = d;

      if (dateStr === todayStr) el.classList.add("today");

      // Click handler to show report for this date
      el.onclick = () => showDayReport(dateStr);

      grid.appendChild(el);
    }
  }

  // Show report for a clicked day
  function showDayReport(dateStr) {
    const dayTasks = tasks.filter(t => t.date === dateStr);
    const reportDiv = document.getElementById("report");

    if (dayTasks.length === 0) {
      reportDiv.innerHTML = `<h3>Tasks for ${dateStr}</h3><p>No tasks.</p>`;
    } else {
      let html = `<h3>Tasks for ${dateStr}</h3><ul>`;
      dayTasks.forEach(t => {
        html += `<li>${t.name} ${t.done ? "✅" : "❌"}</li>`;
      });
      html += "</ul>";
      reportDiv.innerHTML = html;
    }
  }

  // Initialize calendar
  renderCalendar();
</script>

</body>
</html>
