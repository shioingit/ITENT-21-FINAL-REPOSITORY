<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nomi – E-Pet</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #fdf6ee;
      padding: 30px;
    }

    #pet {
      font-size: 80px;
      margin: 20px 0;
      transition: transform 0.2s;
    }

    input {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 200px;
    }

    button {
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f4845f;
      color: white;
      margin-left: 6px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 16px;
    }

    li {
      margin: 8px 0;
      cursor: pointer;
      font-size: 1rem;
    }

    li.done {
      text-decoration: line-through;
      color: #aaa;
    }

    #report {
      margin-top: 20px;
      text-align: left;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h2>🐾 Nomi</h2>
  <div id="pet">🐱</div>

  <input id="task-input" type="text" placeholder="Add a task…">
  <button onclick="addTask()">Add</button>

  <ul id="task-list"></ul>

  <!-- Report button + section -->
  <button onclick="generateReport()">Generate Daily Report</button>
  <div id="report"></div>

<script>
  // Add a task to the list (prevent duplicates)
  function addTask() {
    const input = document.getElementById("task-input");
    const newTask = input.value.trim();
    if (!newTask) return;

    // Check for duplicates (case-insensitive)
    const existingTasks = document.querySelectorAll("#task-list li");
    for (let task of existingTasks) {
      if (task.textContent.toLowerCase() === newTask.toLowerCase()) {
        alert("This task already exists!");
        input.value = "";
        return; // stop here, don’t add duplicate
      }
    }

    // If not duplicate, add task
    const li = document.createElement("li");
    li.textContent = newTask;
    li.onclick = () => {
      li.classList.toggle("done");
      bounce(); // pet reacts when a task is completed
    };

    document.getElementById("task-list").appendChild(li);
    input.value = "";
  }

  // Bounce animation
  function bounce() {
    const pet = document.getElementById("pet");
    pet.style.transform = "scale(1.4)";
    setTimeout(() => pet.style.transform = "scale(1)", 200);
  }

  // Generate report of completed tasks with date
  function generateReport() {
    const tasks = document.querySelectorAll("#task-list li.done");
    const reportDiv = document.getElementById("report");

    // Get today's date in readable format
    const today = new Date();
    const dateString = today.toLocaleDateString(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    if (tasks.length === 0) {
      reportDiv.innerHTML = `<h3>Report for ${dateString}</h3><p>No tasks completed today.</p>`;
    } else {
      let listHTML = `<h3>Report for ${dateString}</h3><ul>`;
      tasks.forEach(task => {
        listHTML += `<li>${task.textContent}</li>`;
      });
      listHTML += "</ul>";
      reportDiv.innerHTML = listHTML;
    }
  }
</script>

</body>
</html>
